name: deployment test

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/forever-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/forever-frontend
  IMAGE_ADMIN: ${{ secrets.DOCKERHUB_USERNAME }}/forever-admin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: ./Admin
          file: ./Admin/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_ADMIN }}:latest
            ${{ env.IMAGE_ADMIN }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_BACKEND: ${{ env.IMAGE_BACKEND }}
          IMAGE_FRONTEND: ${{ env.IMAGE_FRONTEND }}
          IMAGE_ADMIN: ${{ env.IMAGE_ADMIN }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_BACKEND,IMAGE_FRONTEND,IMAGE_ADMIN,GITHUB_SHA
          script_stop: true
          script: |
            set -e
            mkdir -p ~/forever
            cd ~/forever

            echo "Docker login with retries..."
            for i in 1 2 3; do
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin && break
              echo "Retrying Docker login..."
              sleep 5
            done

            # Ensure compose and env files exist on EC2
            test -f docker-compose.prod.yml
            test -f .env

            # Update image tags only (do not overwrite .env secrets)
            echo "Updating image tags safely..."
            echo "IMAGE_BACKEND=$IMAGE_BACKEND:$GITHUB_SHA" > .env.images
            echo "IMAGE_FRONTEND=$IMAGE_FRONTEND:$GITHUB_SHA" >> .env.images
            echo "IMAGE_ADMIN=$IMAGE_ADMIN:$GITHUB_SHA" >> .env.images

            # Pull latest images and restart services (low-downtime)
            echo "Pulling latest images..."
            docker compose --env-file .env.images -f docker-compose.prod.yml pull || {
              echo "Image pull failed"
              exit 1
            }

            echo "Starting containers..."
            docker compose --env-file .env.images -f docker-compose.prod.yml up -d --remove-orphans

            echo "Checking container status..."
            docker compose --env-file .env.images -f docker-compose.prod.yml ps

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "Deployment successful!"
