name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/forever-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/forever-frontend
  IMAGE_ADMIN: ${{ secrets.DOCKERHUB_USERNAME }}/forever-admin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: ./Admin
          file: ./Admin/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=
          tags: |
            ${{ env.IMAGE_ADMIN }}:latest
            ${{ env.IMAGE_ADMIN }}:${{ github.sha }}
